name: Frontend CI and image

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-checks:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:pages-proxy
      - run: npm run test:deployment-config
      - run: npm run build

  browser-acceptance:
    name: Browser acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: cbms_test
          POSTGRES_USER: cbms
          POSTGRES_PASSWORD: cbms_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cbms -d cbms_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://cbms:cbms_ci_only@127.0.0.1:5432/cbms_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: cbms-frontend
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Ditero22/cbms-backend
          path: cbms-backend
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            cbms-frontend/package-lock.json
            cbms-backend/package-lock.json

      - run: npm ci --prefix cbms-backend
      - run: npm ci --prefix cbms-frontend

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
        working-directory: cbms-frontend

      - name: Run isolated browser acceptance suite
        run: npm run test:e2e
        working-directory: cbms-frontend

      - name: Verify JWT startup, refresh, logout, and connection failures
        run: npm run test:e2e -- tests/e2e/jwt-refresh.spec.ts tests/e2e/api-connection.spec.ts
        working-directory: cbms-frontend
        env:
          AUTH_MODE: jwt

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: frontend-browser-acceptance
          path: |
            cbms-frontend/playwright-report
            cbms-frontend/test-results
          if-no-files-found: ignore
          retention-days: 7

  publish-image:
    name: Publish frontend image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [frontend-checks, browser-acceptance]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4 # v4.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf # v6.0.0
        id: metadata
        with:
          images: ghcr.io/ditero22/cbms-frontend
          tags: type=sha,format=long,prefix=sha-

      - uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294 # v7.0.0
        with:
          context: .
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
